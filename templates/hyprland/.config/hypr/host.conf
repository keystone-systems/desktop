# host.conf — per-machine Hyprland overlay (monitors, audio, printers).
#
# hyprland.conf sources this file last, so entries here append to — and can
# override — the shared configuration. Keep one host.conf per machine in your
# dotfiles repo (e.g. a hyprland-<hostname> stow package) and stow the right
# one on each host. This example is a starting point; edit before use.

# Monitors — prefer matching by EDID description (`desc:`) over connector
# names (DP-1, HDMI-A-1), which can change across reboots and docks.
# List connected monitors with: hyprctl monitors
# monitor=desc:Example Corp EX2790 SERIAL123, 3840x2160@60.00, 0x0, 2.00
# monitor=,preferred,auto,1

# Layout tweaks that only make sense on this machine's screen:
# master {
#   new_status=slave
#   orientation=center
# }

# Default audio devices — applied at session start by the keystone audio menu.
# List devices with: wpctl status
# exec-once=env KEYSTONE_AUDIO_DEFAULT_SINK='alsa_output.example-sink' KEYSTONE_AUDIO_DEFAULT_SOURCE='alsa_input.example-source' keystone-audio-menu apply-config-defaults

# Default printer — applied at session start by the keystone printer menu.
# List printers with: lpstat -p
# exec-once=env KEYSTONE_PRINTER_DEFAULT='Example_Printer' keystone-printer-menu apply-config-defaults
