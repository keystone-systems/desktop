# xdg-desktop-portal-hyprland: persistent screen-share grants + walker picker.
# allow_token_by_default lets apps (OBS, Chromium via restore tokens) reconnect
# to a granted capture without re-prompting. keystone-share-picker replaces the
# stock Qt picker with a walker dmenu list grouped by Hyprland workspace.
screencopy {
    allow_token_by_default = true
    custom_picker_binary = keystone-share-picker
}
