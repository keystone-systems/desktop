$browser=uwsm app -- chromium --new-window --ozone-platform=wayland
$fileManager=uwsm app -- nautilus --new-window
$mod=SUPER
$terminal=uwsm app -- ghostty
animations {
  bezier=easeOutQuint,0.23,1,0.32,1
  bezier=easeInOutCubic,0.65,0.05,0.36,1
  bezier=linear,0,0,1,1
  bezier=almostLinear,0.5,0.5,0.75,1.0
  bezier=quick,0.15,0,0.1,1
  animation=global, 1, 10, default
  animation=border, 1, 5.39, easeOutQuint
  animation=windows, 1, 4.79, easeOutQuint
  animation=windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation=windowsOut, 1, 1.49, linear, popin 87%
  animation=fadeIn, 1, 1.73, almostLinear
  animation=fadeOut, 1, 1.46, almostLinear
  animation=fade, 1, 3.03, quick
  animation=layers, 1, 3.81, easeOutQuint
  animation=layersIn, 1, 4, easeOutQuint, fade
  animation=layersOut, 1, 1.5, linear, fade
  animation=fadeLayersIn, 1, 1.79, almostLinear
  animation=fadeLayersOut, 1, 1.39, almostLinear
  animation=workspaces, 0, 0, ease
  enabled=true
}

cursor {
  no_hardware_cursors=true
}

decoration {
  blur {
    enabled=true
    passes=2
    size=5
    vibrancy=0.169600
  }

  shadow {
    color=rgba(00000045)
    enabled=false
    range=30
    render_power=3
  }
  rounding=4
}

dwindle {
  force_split=2
  preserve_split=true
}

ecosystem {
  no_update_news=true
}

general {
  layout=master
}

input {
  touchpad {
    drag_lock=false
    natural_scroll=true
  }
  follow_mouse=1
  kb_layout=us
  kb_options=ctrl:nocaps,altwin:swap_alt_win
  scroll_factor=0.400000
  sensitivity=0
}

master {
  new_status=master
}

misc {
  disable_hyprland_logo=true
  disable_splash_rendering=true
  disable_watchdog_warning=true
  force_default_wallpaper=0
}

xwayland {
  force_zero_scaling=true
}
bind=$mod, Return, exec, ghostty
bind=$mod, Space, exec, wofi --show drun
bind=$mod, B, exec, $browser
bind=$mod, E, exec, $fileManager
bind=$mod, Escape, exec, keystone-menu system
bind=$mod, K, exec, keystone-menu-keybindings
bind=$mod, W, killactive,
bind=CTRL ALT, DELETE, exec, hyprctl dispatch closewindow address:*
bind=$mod SHIFT, V, togglefloating,
bind=$mod, P, pseudo,
bind=$mod, H, movefocus, l
bind=$mod, L, movefocus, r
bind=$mod, T, layoutmsg, togglesplit
bind=$mod, left, movefocus, l
bind=$mod, right, movefocus, r
bind=$mod, up, movefocus, u
bind=$mod, down, movefocus, d
bind=$mod SHIFT, left, swapwindow, l
bind=$mod SHIFT, right, swapwindow, r
bind=$mod SHIFT, up, swapwindow, u
bind=$mod SHIFT, down, swapwindow, d
bind=$mod, 1, workspace, 1
bind=$mod, 2, workspace, 2
bind=$mod, 3, workspace, 3
bind=$mod, 4, workspace, 4
bind=$mod, 5, workspace, 5
bind=$mod, 6, workspace, 6
bind=$mod, 7, workspace, 7
bind=$mod, 8, workspace, 8
bind=$mod, 9, workspace, 9
bind=$mod, 0, workspace, 10
bind=$mod SHIFT, 1, movetoworkspace, 1
bind=$mod SHIFT, 2, movetoworkspace, 2
bind=$mod SHIFT, 3, movetoworkspace, 3
bind=$mod SHIFT, 4, movetoworkspace, 4
bind=$mod SHIFT, 5, movetoworkspace, 5
bind=$mod SHIFT, 6, movetoworkspace, 6
bind=$mod SHIFT, 7, movetoworkspace, 7
bind=$mod SHIFT, 8, movetoworkspace, 8
bind=$mod SHIFT, 9, movetoworkspace, 9
bind=$mod SHIFT, 0, movetoworkspace, 10
bind=$mod, TAB, workspace, e+1
bind=$mod SHIFT, TAB, workspace, e-1
bind=$mod CTRL, TAB, workspace, previous
bind=$mod, comma, workspace, -1
bind=$mod, period, workspace, +1
bind=$mod SHIFT, comma, movetoworkspace, -1
bind=$mod SHIFT, period, movetoworkspace, +1
bind=$mod, mouse_down, workspace, e+1
bind=$mod, mouse_up, workspace, e-1
bind=ALT, TAB, cyclenext,
bind=ALT SHIFT, TAB, cyclenext, prev
bind=ALT, TAB, bringactivetotop,
bind=ALT SHIFT, TAB, bringactivetotop,
bind=$mod, S, togglespecialworkspace, magic
bind=$mod SHIFT, S, movetoworkspace, special:magic
bind=$mod, F, fullscreen,
bind=SHIFT, F11, fullscreen, 0
bind=ALT, F11, fullscreen, 1
bind=$mod SHIFT, T, layoutmsg, togglesplit
bind=$mod, minus, resizeactive, -100 0
bind=$mod, equal, resizeactive, 100 0
bind=$mod SHIFT, minus, resizeactive, 0 -100
bind=$mod SHIFT, equal, resizeactive, 0 100
bind=$mod, C, sendshortcut, CTRL, Insert,
bind=$mod, V, sendshortcut, SHIFT, Insert,
bind=$mod, X, sendshortcut, CTRL, X,
bind=$mod CTRL, V, exec, ghostty --class clipse -e clipse
bind=$mod CTRL, E, exec, walker -m symbols
bind=$mod SHIFT, Space, exec, killall -SIGUSR1 waybar
bind=$mod, Backspace, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bind=$mod SHIFT, N, exec, makoctl dismiss
bind=$mod ALT, N, exec, makoctl dismiss --all
bind=$mod CTRL SHIFT, N, exec, makoctl mode -t do-not-disturb
bind=, Print, exec, keystone-screenshot
bind=SHIFT, Print, exec, keystone-screenshot smart clipboard
bind=$mod, Print, exec, hyprpicker -a
bind=$mod CTRL, I, exec, keystone-idle-toggle
bind=$mod CTRL, N, exec, keystone-nightlight-toggle
# keystone-window-switch is not shipped by this flake — uncomment and point at your own window switcher.
# bind=$mod, slash, exec, keystone-window-switch
bindel=,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel=,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel=,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel=,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel=,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel=,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl=, XF86AudioNext, exec, playerctl next
bindl=, XF86AudioPause, exec, playerctl play-pause
bindl=, XF86AudioPlay, exec, playerctl play-pause
bindl=, XF86AudioPrev, exec, playerctl previous
bindl=, XF86PowerOff, exec, keystone-menu system
# A failed lock requests session termination and deliberately blocks suspend.
bindl=, switch:on:Lid Switch, exec, keystone-lock --fail-closed && systemctl suspend
bindl=, switch:off:Lid Switch, exec, hyprctl dispatch dpms on
bindm=$mod, mouse:272, movewindow
bindm=$mod, mouse:273, resizewindow
env=GDK_SCALE,2
env=XCURSOR_SIZE,24
env=HYPRCURSOR_SIZE,24
env=XCURSOR_THEME,Adwaita
env=HYPRCURSOR_THEME,Adwaita
env=GDK_BACKEND,wayland
env=QT_QPA_PLATFORM,wayland
env=QT_STYLE_OVERRIDE,kvantum
env=SDL_VIDEODRIVER,wayland
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=OZONE_PLATFORM,wayland
env=CHROMIUM_FLAGS,"--enable-features=UseOzonePlatform --ozone-platform=wayland --gtk-version=4"
env=XDG_DATA_DIRS,$XDG_DATA_DIRS:$HOME/.nix-profile/share:/nix/var/nix/profiles/default/share
env=PATH,$HOME/.local/bin:$PATH
env=XCOMPOSEFILE,~/.XCompose
env=EDITOR,hx
env=SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent
env=GTK_THEME,Adwaita:dark
env=WLR_RENDERER_ALLOW_SOFTWARE,1
exec-once=systemctl --user import-environment
exec-once=dbus-update-activation-environment --systemd --all
exec-once=keystone-startup-lock
exec-once=sh -c 'for card in /sys/class/drm/card*/device/driver; do readlink -f $card 2>/dev/null; done | grep -q virtio || uwsm app -- hyprsunset'
exec-once=systemctl --user start hyprpolkitagent
exec-once=wl-clip-persist --clipboard regular & uwsm app -- clipse -listen
layerrule=no_anim on, match:namespace slurp
windowrule=tile on, match:class ^(chromium)$
windowrule=float on, match:class ^(org.pulseaudio.pavucontrol|.blueman-manager-wrapped|blueman-manager)$
windowrule=opacity 0.97 0.9, match:class .*
windowrule=opacity 1 1, match:class ^(chromium|google-chrome|google-chrome-unstable)$, match:title .*Youtube.*
windowrule=opacity 1 0.97, match:class ^(chromium|google-chrome|google-chrome-unstable)$
windowrule=opacity 0.97 0.9, match:class ^(chrome-.*-Default)$
windowrule=opacity 1 1, match:class ^(chrome-youtube.*-Default)$
windowrule=opacity 1 1, match:class ^(zoom|vlc|org.kde.kdenlive|com.obsproject.Studio)$
windowrule=opacity 1 1, match:class ^(com.libretro.RetroArch|steam)$
windowrule=float on, match:class (clipse)
windowrule=size 622 652, match:class (clipse)
windowrule=float on, match:class ^(com.mitchellh.ghostty)$, match:title ^(keystone-notes-inbox)$
windowrule=center on, match:class ^(com.mitchellh.ghostty)$, match:title ^(keystone-notes-inbox)$
windowrule=size 1000 700, match:class ^(com.mitchellh.ghostty)$, match:title ^(keystone-notes-inbox)$
windowrule=float on, match:class ^$, match:title ^(Authentication required)$
windowrule=center on, match:class ^$, match:title ^(Authentication required)$
windowrule=size 486 246, match:class ^$, match:title ^(Authentication required)$
windowrule=pin on, match:class ^$, match:title ^(Authentication required)$
windowrule=opacity 0.85 0.78, match:class ^$, match:title ^(Authentication required)$
windowrule=rounding 12, match:class ^$, match:title ^(Authentication required)$
source = ~/.config/themes/current/hyprland.conf

source = ~/.config/hypr/user.conf
source = ~/.config/hypr/host.conf
