general {
  after_sleep_cmd=keystone-dpms-wake || (hyprctl dispatch dpms on && brightnessctl -r)
  before_sleep_cmd=pidof hyprlock || hyprlock
  ignore_dbus_inhibit=true
  inhibit_sleep=3
  lock_cmd=pidof hyprlock || hyprlock
}

listener {
  on-timeout=pidof hyprlock || hyprlock
  timeout=300
}

listener {
  on-resume=keystone-dpms-wake || (hyprctl dispatch dpms on && brightnessctl -r)
  on-timeout=hyprctl dispatch dpms off
  timeout=330
}
