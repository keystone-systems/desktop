general {
  # TODO: switch back to `keystone-dpms-wake || (...)` once the wedged-connector
  # watchdog is proven out; disabled for now to observe baseline behavior.
  after_sleep_cmd=hyprctl dispatch dpms on && brightnessctl -r
  before_sleep_cmd=pidof hyprlock || hyprlock
  ignore_dbus_inhibit=true
  inhibit_sleep=3
  lock_cmd=pidof hyprlock || hyprlock
}

listener {
  on-timeout=pidof hyprlock || hyprlock
  timeout=300
}

listener {
  # TODO: switch back to `keystone-dpms-wake || (...)` (see general block above).
  on-resume=hyprctl dispatch dpms on && brightnessctl -r
  on-timeout=hyprctl dispatch dpms off
  timeout=330
}
