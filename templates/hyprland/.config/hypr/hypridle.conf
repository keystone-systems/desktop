# hyprctl dispatch takes Lua since Hyprland 0.56 — the legacy `dispatch dpms
# off` string is a Lua syntax error, not an unknown dispatcher, so it fails
# every time. Keep these in the `hl.dsp.*` form.
general {
  after_sleep_cmd=keystone-dpms-wake || (hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r)
  before_sleep_cmd=keystone-lock --fail-closed
  ignore_dbus_inhibit=true
  inhibit_sleep=3
  lock_cmd=keystone-lock
}

listener {
  on-timeout=keystone-lock
  timeout=300
}

listener {
  on-resume=keystone-dpms-wake || (hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r)
  on-timeout=hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
  timeout=330
}
