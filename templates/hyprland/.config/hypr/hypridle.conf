# Canonical form: ks.systems/desktop templates/hyprland hypridle.conf.
#
# Hyprland 0.56 treats `hyprctl dispatch` as Lua shorthand, so DPMS commands
# must pass typed hl.dsp.dpms expressions rather than legacy bare arguments.
# keystone-dpms-wake fronts the wake path because a DP connector can come back
# from resume wedged, with the kernel reporting it disabled.
general {
  after_sleep_cmd=keystone-dpms-wake || (hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r)
  before_sleep_cmd=keystone-lock
  ignore_dbus_inhibit=true
  inhibit_sleep=3
  lock_cmd=keystone-lock
}

listener {
  on-timeout=keystone-lock
  timeout=300
}

listener {
  on-resume=keystone-dpms-wake || (hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r)
  on-timeout=hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
  timeout=330
}
