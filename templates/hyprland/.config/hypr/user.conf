# user.conf — your personal Hyprland overlay.
#
# hyprland.conf sources this file last (after the theme and before host.conf),
# so anything here appends to — and can override — the shared configuration.
# Put identity-specific binds, window rules, and startup dispatches here.
# This file is yours: seed-dotfiles never overwrites it without --force.

# Examples (uncomment and adapt):

# Start on a specific workspace after login:
# exec-once = hyprctl dispatch workspace 2

# Tag messaging apps and keep them off screen shares:
# windowrule = tag +messaging, match:class Signal
# windowrule = no_screen_share on, match:tag messaging
# windowrule = workspace special:magic, match:tag messaging

# Personal binds:
# bind = $mod, N, exec, uwsm app -- obsidian
